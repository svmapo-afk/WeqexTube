name: Build WeqexTube APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v6

      - name: Fetch latest LibreTube source
        run: |
          git clone --depth 1 https://github.com/libre-tube/LibreTube.git source
          git -C source log -1 --format='Upstream source: %H (%cs)'

      - name: Install build inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick apksigner

      - name: Apply WeqexTube 1.0.12 Google OAuth and extractor fix
        working-directory: source
        run: |
          sed -i 's/applicationId = "com.github.libretube"/applicationId = "app.weqextube"/' app/build.gradle.kts
          sed -i '/applicationIdSuffix = ".debug"/d' app/build.gradle.kts
          sed -i 's/resValue("string", "app_name", "LibreTube")/resValue("string", "app_name", "WeqexTube")/' app/build.gradle.kts
          sed -i 's/resValue("string", "app_name", "LibreTube Debug")/resValue("string", "app_name", "WeqexTube")/' app/build.gradle.kts
          sed -i 's/rootProject.name = "LibreTube"/rootProject.name = "WeqexTube"/' settings.gradle.kts
          sed -Ei 's/versionCode = [0-9]+/versionCode = 13/' app/build.gradle.kts
          sed -Ei 's/versionName = "[^"]+"/versionName = "1.0.12"/' app/build.gradle.kts

          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          # Replace every user-visible localized occurrence, including spellings
          # such as "Libretube" that the previous case-sensitive replacement missed.
          for path in Path("app/src/main/res").glob("values*/strings.xml"):
              text = path.read_text()
              path.write_text(re.sub(r"libretube", "WeqexTube", text, flags=re.IGNORECASE))

          # Rebrand user-visible links, backup names and the update channel.
          replacements = {
              Path("app/src/main/java/com/github/libretube/ui/preferences/BackupRestoreSettings.kt"): {
                  "libretube-backup-": "weqextube-backup-",
              },
              Path("app/src/main/java/com/github/libretube/api/ExternalApi.kt"): {
                  "https://api.github.com/repos/libre-tube/LibreTube/releases/latest":
                      "https://api.github.com/repos/svmapo-afk/WeqexTube/releases/latest",
              },
              Path("app/src/main/java/com/github/libretube/ui/activities/AboutActivity.kt"): {
                  "https://github.com/libre-tube/LibreTube#donate":
                      "https://github.com/svmapo-afk/WeqexTube",
                  "https://libretube.dev":
                      "https://github.com/svmapo-afk/WeqexTube",
                  "https://github.com/libre-tube/LibreTube":
                      "https://github.com/svmapo-afk/WeqexTube",
                  "https://hosted.weblate.org/projects/libretube/libretube/":
                      "https://github.com/svmapo-afk/WeqexTube",
              },
              Path("app/src/main/java/com/github/libretube/ui/activities/HelpActivity.kt"): {
                  "https://libretube.dev/#faq":
                      "https://github.com/svmapo-afk/WeqexTube",
                  "https://matrix.to/#/#LibreTube:matrix.org":
                      "https://github.com/svmapo-afk/WeqexTube/issues",
                  "https://fosstodon.org/@libretube":
                      "https://github.com/svmapo-afk/WeqexTube/issues",
                  "https://feddit.rocks/c/libretube":
                      "https://github.com/svmapo-afk/WeqexTube/issues",
              },
          }
          for path, items in replacements.items():
              text = path.read_text()
              for old, new in items.items():
                  text = text.replace(old, new)
              path.write_text(text)

          # Replace the wordmark that LibreTube hard-codes in ThemeHelper.
          theme_helper = Path("app/src/main/java/com/github/libretube/helpers/ThemeHelper.kt")
          text = theme_helper.read_text()
          text = text.replace(
              'return "Libre<span  style=\'color:$hexColor\';>Tube</span>"',
              'return "Weqex<span  style=\'color:$hexColor\';>Tube</span>"',
          )
          text = text.replace(
              'if (accentColor.isEmpty()) {',
              'if (accentColor.isEmpty() || accentColor == "my") {',
          )
          text = text.replace(
              'accentColor = if (DynamicColors.isDynamicColorAvailable()) "my" else "blue"',
              'accentColor = "weqex"',
          )
          text = text.replace(
              '"violet" -> R.style.Theme_Violet',
              '"violet" -> R.style.Theme_Violet\n            "weqex" -> R.style.Theme_Weqex',
          )
          theme_helper.write_text(text)

          # Add a fixed soft light palette so the phone wallpaper cannot turn
          # WeqexTube pink through Android dynamic colors.
          weqex_style = """
              <style name="Theme.Weqex" parent="BaseTheme">
                  <item name="colorPrimary">#213148</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="colorPrimaryContainer">#DDE6F0</item>
                  <item name="colorOnPrimaryContainer">#172235</item>
                  <item name="colorSecondary">#50627A</item>
                  <item name="colorOnSecondary">#FFFFFF</item>
                  <item name="colorSecondaryContainer">#E3EAF2</item>
                  <item name="colorOnSecondaryContainer">#1D2C3E</item>
                  <item name="colorSurface">#EEF3F8</item>
                  <item name="colorOnSurface">#1D2C3E</item>
                  <item name="colorSurfaceVariant">#E5EBF2</item>
                  <item name="colorOnSurfaceVariant">#445267</item>
                  <item name="colorSurfaceContainer">#E9EFF5</item>
                  <item name="colorOutline">#93A1B2</item>
                  <item name="android:colorBackground">#EEF3F8</item>
                  <item name="android:navigationBarColor">#EEF3F8</item>
                  <item name="android:statusBarColor">#EEF3F8</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          """
          for path in [
              Path("app/src/main/res/values/themes.xml"),
              Path("app/src/main/res/values-night/themes.xml"),
          ]:
              text = path.read_text()
              text = text.replace("</resources>", weqex_style + "\n</resources>")
              path.write_text(text)

          Path("app/src/main/res/drawable/weqex_panel.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#E9EFF5"/>
              <corners android:radius="22dp"/>
              <stroke android:width="1dp" android:color="#F9FBFD"/>
              <padding android:left="8dp" android:top="6dp" android:right="8dp" android:bottom="6dp"/>
          </shape>
          """)
          Path("app/src/main/res/drawable/weqex_card.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#DDE6F0"/>
                      <corners android:radius="18dp"/>
                      <stroke android:width="1dp" android:color="#C8D3DF"/>
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#EEF3F8"/>
                      <corners android:radius="18dp"/>
                      <stroke android:width="1dp" android:color="#FFFFFF"/>
                  </shape>
              </item>
          </selector>
          """)

          # Restyle the visible shell and video cards instead of only changing
          # the launcher icon.
          activity_main = Path("app/src/main/res/layout/activity_main.xml")
          text = activity_main.read_text()
          text = text.replace(
              'android:background="@android:color/transparent"\n        app:layout_constraintStart_toStartOf="parent"',
              'android:background="@drawable/weqex_panel"\n        android:elevation="6dp"\n        app:layout_constraintStart_toStartOf="parent"',
          )
          text = text.replace(
              'android:id="@+id/bottomNav"\n        android:layout_width="match_parent"',
              'android:id="@+id/bottomNav"\n        android:layout_width="match_parent"\n        android:background="@drawable/weqex_panel"\n        android:elevation="10dp"',
          )
          activity_main.write_text(text)

          for layout_name in ["fragment_home.xml", "fragment_trends.xml", "fragment_trends_content.xml"]:
              path = Path("app/src/main/res/layout") / layout_name
              text = path.read_text()
              head, rest = text.split(">", 1)
              if "android:background=" in head:
                  head = re.sub(
                      r'android:background="[^"]*"',
                      'android:background="#EEF3F8"',
                      head,
                      count=1,
                  )
              else:
                  first = 'android:layout_height="match_parent"'
                  head = head.replace(first, first + '\n    android:background="#EEF3F8"', 1)
              path.write_text(head + ">" + rest)

          card = Path("app/src/main/res/layout/trending_row.xml")
          text = card.read_text()
          text = text.replace('android:background="@drawable/rounded_ripple"', 'android:background="@drawable/weqex_card"')
          text = text.replace(
              'android:layout_height="wrap_content"\n    android:background',
              'android:layout_height="wrap_content"\n    android:layout_margin="6dp"\n    android:elevation="3dp"\n    android:background',
              1,
          )
          text = text.replace('app:cardCornerRadius="8dp"', 'app:cardCornerRadius="16dp"', 1)
          card.write_text(text)

          # Add automatic playback recovery. Local extraction remains the first
          # choice. If YouTube blocks the phone/VPN IP, retry through healthy
          # independent Piped endpoints instead of immediately failing.
          resilient_source = textwrap.dedent("""
          package com.github.libretube.api

          import com.github.libretube.api.obj.Streams
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.TimeoutCancellationException
          import kotlinx.coroutines.withTimeout
          import org.schabi.newpipe.extractor.exceptions.SignInConfirmNotBotException

          internal class ResilientMediaServiceRepository(
              private val primary: MediaServiceRepository,
              private val fallbackOnAnyError: Boolean = false,
          ) : MediaServiceRepository by primary {
              override suspend fun getStreams(videoId: String): Streams {
                  val firstError = try {
                      return primary.getStreams(videoId)
                  } catch (error: CancellationException) {
                      throw error
                  } catch (error: Exception) {
                      error
                  }

                  if (!fallbackOnAnyError && !firstError.isAnonymousYouTubeBlock()) {
                      throw firstError
                  }

                  val endpoints = listOf(
                      "https://api.piped.private.coffee",
                      "https://pipedapi.orangenet.cc",
                      PipedMediaServiceRepository.apiUrl,
                  ).distinct()

                  for (endpoint in endpoints) {
                      try {
                          return withTimeout(12_000) {
                              RetrofitInstance.buildRetrofitInstance<PipedApi>(endpoint)
                                  .getStreams(videoId)
                                  .also { streams ->
                                      streams.isShort = streams.videoStreams.firstOrNull()?.let { stream ->
                                          (stream.height ?: 0) > (stream.width ?: 0)
                                      } ?: false
                                  }
                          }
                      } catch (error: TimeoutCancellationException) {
                          firstError.addSuppressed(error)
                      } catch (error: CancellationException) {
                          throw error
                      } catch (error: Exception) {
                          firstError.addSuppressed(error)
                      }
                  }

                  throw firstError
              }
          }

          private fun Throwable.isAnonymousYouTubeBlock(): Boolean {
              var current: Throwable? = this
              repeat(12) {
                  val error = current ?: return false
                  if (error is SignInConfirmNotBotException) return true

                  val message = error.message.orEmpty().lowercase()
                  if (
                      "login_required" in message ||
                      "confirm that you're not a bot" in message ||
                      "confirm you’re not a bot" in message ||
                      "anonymous watch access" in message ||
                      "player response is not valid" in message ||
                      "visionos player response" in message ||
                      "android player response" in message
                  ) return true

                  current = error.cause
              }
              return false
          }
          """).lstrip()
          Path("app/src/main/java/com/github/libretube/api/ResilientMediaServiceRepository.kt").write_text(resilient_source)

          media_repository = Path("app/src/main/java/com/github/libretube/api/MediaServiceRepository.kt")
          text = media_repository.read_text()
          old = "\n".join([
              "        val instance: MediaServiceRepository",
              "            get() = when {",
              "                PlayerHelper.fullLocalMode -> NewPipeMediaServiceRepository()",
              "                PlayerHelper.localStreamExtraction -> LocalStreamsExtractionPipedMediaServiceRepository()",
              "                else -> PipedMediaServiceRepository()",
              "            }",
              "",
          ])
          new = "\n".join([
              "        val instance: MediaServiceRepository",
              "            get() {",
              "                val primary = when {",
              "                    PlayerHelper.fullLocalMode -> NewPipeMediaServiceRepository()",
              "                    PlayerHelper.localStreamExtraction -> LocalStreamsExtractionPipedMediaServiceRepository()",
              "                    else -> PipedMediaServiceRepository()",
              "                }",
              "                return ResilientMediaServiceRepository(",
              "                    primary = primary,",
              "                    fallbackOnAnyError = primary is PipedMediaServiceRepository,",
              "                )",
              "            }",
              "",
          ])
          if old not in text:
              raise SystemExit("MediaServiceRepository factory structure changed upstream")
          media_repository.write_text(text.replace(old, new))

          # Piped fallback responses often expose a single progressive MP4
          # containing both audio and video. LibreTube's DASH builder discards
          # those streams, so play them directly and preserve their proxy URL.
          player_service = Path("app/src/main/java/com/github/libretube/services/OnlinePlayerService.kt")
          text = player_service.read_text()
          stream_marker = "        val streams = streams ?: return\n"
          progressive_lookup = "\n".join([
              "        val progressiveStream = streams.videoStreams.firstOrNull {",
              "            it.videoOnly == false && !it.url.isNullOrBlank()",
              "        }",
              "",
          ])
          if progressive_lookup not in text:
              text = text.replace(stream_marker, stream_marker + progressive_lookup, 1)

          dash_marker = "\n".join([
              "            // DASH",
              "            streams.videoStreams.isNotEmpty() -> {",
              "",
          ])
          progressive_branch = "\n".join([
              "            // Progressive Piped/Odysee fallback with audio and video in one file.",
              "            progressiveStream != null -> {",
              "                val mediaItem = createMediaItem(",
              "                    progressiveStream.url!!.toUri(),",
              "                    progressiveStream.mimeType ?: MimeTypes.VIDEO_MP4,",
              "                    streams",
              "                )",
              "                exoPlayer?.setMediaItem(mediaItem)",
              "                return",
              "            }",
              "            // DASH",
              "            streams.videoStreams.isNotEmpty() -> {",
              "",
          ])
          if dash_marker not in text:
              raise SystemExit("OnlinePlayerService DASH structure changed upstream")
          text = text.replace(dash_marker, progressive_branch, 1)
          player_service.write_text(text)

          # Remove all selectable alternative launcher aliases so Android cannot
          # retain an old LibreTube icon selected in an earlier installation.
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = re.sub(
              r'\s*<activity-alias\b(?=[^>]*android:name="\.(?:IconGradient|DefaultLight|IconFire|IconFlame|IconShaped|IconTorch|IconLegacy|IconBird)")[\s\S]*?</activity-alias>',
              '',
              text,
          )
          manifest.write_text(text)
          PY

          # Add real Google OAuth device authorization and connect its access
          # token to NewPipeExtractor's YouTube requests.
          mkdir -p app/src/main/java/com/github/libretube/oauth
          cp "$GITHUB_WORKSPACE/patches/oauth/YoutubeOAuthManager.kt" app/src/main/java/com/github/libretube/oauth/YoutubeOAuthManager.kt
          cp "$GITHUB_WORKSPACE/patches/oauth/YoutubeLoginActivity.kt" app/src/main/java/com/github/libretube/ui/activities/YoutubeLoginActivity.kt

          python3 - <<'PY'
          from pathlib import Path

          app = Path("app/src/main/java/com/github/libretube/LibreTubeApp.kt")
          text = app.read_text()
          text = text.replace(
              "import com.github.libretube.helpers.ProxyHelper",
              "import com.github.libretube.helpers.ProxyHelper\nimport com.github.libretube.oauth.YoutubeOAuthManager",
          )
          text = text.replace(
              "        instance = this",
              "        instance = this\n        YoutubeOAuthManager.initialize(applicationContext)",
              1,
          )
          app.write_text(text)

          downloader = Path("app/src/main/java/com/github/libretube/util/NewPipeDownloaderImpl.kt")
          text = downloader.read_text()
          text = text.replace(
              "package com.github.libretube.util\n",
              "package com.github.libretube.util\n\nimport com.github.libretube.oauth.YoutubeOAuthManager\n",
          )
          marker = "        val response = client.newCall(requestBuilder.build()).execute()"
          authenticated = """        if (
              url.contains("youtube.com") ||
              url.contains("youtubei.googleapis.com")
          ) {
              YoutubeOAuthManager.authorizationHeader()?.let { authorization ->
                  requestBuilder.header("Authorization", authorization)
                  requestBuilder.header("X-Goog-AuthUser", "0")
              }
          }
          val response = client.newCall(requestBuilder.build()).execute()"""
          if marker not in text:
              raise SystemExit("NewPipeDownloaderImpl structure changed upstream")
          downloader.write_text(text.replace(marker, authenticated, 1))

          settings = Path("app/src/main/res/xml/settings.xml")
          text = settings.read_text()
          instance_key = 'app:key="instance"'
          key_position = text.find(instance_key)
          if key_position < 0:
              raise SystemExit("settings.xml instance preference missing")
          preference_start = text.rfind("<Preference", 0, key_position)
          if preference_start < 0:
              raise SystemExit("settings.xml preference start missing")
          account = """<Preference
              android:icon="@drawable/ic_login_filled"
              app:key="youtube_account"
              app:summary="Вход Google для запросов воспроизведения"
              app:title="YouTube-аккаунт" />

          """
          settings.write_text(text[:preference_start] + account + text[preference_start:])

          main_settings = Path("app/src/main/java/com/github/libretube/ui/preferences/MainSettings.kt")
          text = main_settings.read_text()
          text = text.replace("import android.os.Bundle", "import android.content.Intent\nimport android.os.Bundle")
          text = text.replace(
              "import com.github.libretube.ui.base.BasePreferenceFragment",
              "import com.github.libretube.ui.activities.YoutubeLoginActivity\nimport com.github.libretube.ui.base.BasePreferenceFragment",
          )
          marker = "        val update = findPreference<Preference>(\"update\")"
          listener = """        findPreference<Preference>("youtube_account")?.setOnPreferenceClickListener {
              startActivity(Intent(requireContext(), YoutubeLoginActivity::class.java))
              true
          }

          """
          if marker not in text:
              raise SystemExit("MainSettings structure changed upstream")
          main_settings.write_text(text.replace(marker, listener + marker, 1))

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          marker = """        <activity
              android:name=".ui.activities.SettingsActivity"
              android:label="@string/settings"
              android:screenOrientation="locked" />
          """
          activity = """
          <activity
              android:name=".ui.activities.YoutubeLoginActivity"
              android:exported="false"
              android:label="YouTube-аккаунт"
              android:screenOrientation="locked" />
          """
          if marker not in text:
              raise SystemExit("AndroidManifest activity structure changed upstream")
          manifest.write_text(text.replace(marker, marker + activity, 1))
          PY

          # Debug resources override main. Removing them is required for the
          # packaged APK to use WeqexTube's launcher artwork and app label.
          rm -rf app/src/debug/res

          sed -i 's|@drawable/splash_icon|@mipmap/ic_launcher_foreground|g' app/src/main/res/values/themes.xml app/src/main/res/values-night/themes.xml app/src/main/res/drawable/splash_anim.xml
          sed -i 's|@drawable/ic_launcher_lockscreen|@mipmap/ic_launcher|g' app/src/main/res/layout/app_icon_header.xml

          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            directory="app/src/main/res/mipmap-$1"
            convert "$GITHUB_WORKSPACE/assets/weqextube-icon.png" -filter Lanczos -resize "$2x$2" -strip "$directory/ic_launcher.png"
            cp "$directory/ic_launcher.png" "$directory/ic_launcher_round.png"
            foreground_size=$(( $2 * 9 / 4 ))
            convert "$GITHUB_WORKSPACE/assets/weqextube-icon.png" -filter Lanczos -resize "${foreground_size}x${foreground_size}" -strip "$directory/ic_launcher_foreground.png"
          done

          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#1D2C3E" android:pathData="M23,48 L31,48 L31,60 L23,60 Z M36,40 L44,40 L44,68 L36,68 Z M49,31 L57,31 L57,77 L49,77 Z M62,39 L86,54 L62,69 Z"/></vector>' > app/src/main/res/drawable/ic_launcher_monochrome.xml

      - name: Verify all visible source branding
        working-directory: source
        run: |
          grep -q 'applicationId = "app.weqextube"' app/build.gradle.kts
          grep -q 'versionCode = 13' app/build.gradle.kts
          grep -q 'versionName = "1.0.12"' app/build.gradle.kts
          grep -q '<string name="app_name" translatable="false">WeqexTube</string>' app/src/main/res/values/strings.xml
          grep -q '<string name="about">О WeqexTube</string>' app/src/main/res/values-ru/strings.xml
          grep -q 'Добро пожаловать в WeqexTube' app/src/main/res/values-ru/strings.xml
          grep -q 'svmapo-afk/WeqexTube/releases/latest' app/src/main/java/com/github/libretube/api/ExternalApi.kt
          grep -q 'weqextube-backup-' app/src/main/java/com/github/libretube/ui/preferences/BackupRestoreSettings.kt
          grep -q 'return "Weqex<span' app/src/main/java/com/github/libretube/helpers/ThemeHelper.kt
          grep -q '"weqex" -> R.style.Theme_Weqex' app/src/main/java/com/github/libretube/helpers/ThemeHelper.kt
          grep -q 'style name="Theme.Weqex"' app/src/main/res/values/themes.xml
          grep -q '@drawable/weqex_card' app/src/main/res/layout/trending_row.xml
          grep -q 'ResilientMediaServiceRepository' app/src/main/java/com/github/libretube/api/MediaServiceRepository.kt
          grep -q 'api.piped.private.coffee' app/src/main/java/com/github/libretube/api/ResilientMediaServiceRepository.kt
          grep -q 'pipedapi.orangenet.cc' app/src/main/java/com/github/libretube/api/ResilientMediaServiceRepository.kt
          grep -q 'catch (error: TimeoutCancellationException)' app/src/main/java/com/github/libretube/api/ResilientMediaServiceRepository.kt
          grep -q 'visionos player response' app/src/main/java/com/github/libretube/api/ResilientMediaServiceRepository.kt
          grep -q 'progressiveStream != null' app/src/main/java/com/github/libretube/services/OnlinePlayerService.kt
          grep -q 'progressiveStream.url!!.toUri()' app/src/main/java/com/github/libretube/services/OnlinePlayerService.kt
          grep -q '208620062506-p8huru5oe2lrcn8a72v25dsu3i543aag.apps.googleusercontent.com' app/src/main/java/com/github/libretube/oauth/YoutubeOAuthManager.kt
          grep -q 'YoutubeOAuthManager.authorizationHeader()' app/src/main/java/com/github/libretube/util/NewPipeDownloaderImpl.kt
          grep -q 'app:key="youtube_account"' app/src/main/res/xml/settings.xml
          grep -q 'YoutubeLoginActivity' app/src/main/AndroidManifest.xml
          test ! -d app/src/debug/res
          test "$(grep -c '<activity-alias' app/src/main/AndroidManifest.xml)" -eq 1
          if grep -R -i "libretube" app/src/main/res/values*/strings.xml; then
            exit 1
          fi
          expected="$(sha256sum app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | cut -d' ' -f1)"
          printf '%s' "$expected" > "$GITHUB_WORKSPACE/expected-icon.sha256"

      - name: Build installable APK
        working-directory: source
        run: ./gradlew --no-daemon --refresh-dependencies :app:assembleDebug

      - name: Inspect packaged name, version, strings and icon
        run: |
          apk="source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"

          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -q "package: name='app.weqextube' versionCode='13' versionName='1.0.12'" /tmp/badging.txt
          grep -q "application-label:'WeqexTube'" /tmp/badging.txt

          "$aapt" dump resources "$apk" > /tmp/resources.txt
          if grep -Eqi 'LibreTube|Libretube' /tmp/resources.txt; then
            grep -Ei 'LibreTube|Libretube' /tmp/resources.txt
            exit 1
          fi

          unzip -p "$apk" res/mipmap-xxxhdpi-v4/ic_launcher.png > /tmp/apk-launcher.png
          actual="$(sha256sum /tmp/apk-launcher.png | cut -d' ' -f1)"
          expected="$(cat expected-icon.sha256)"
          test "$actual" = "$expected"

          apksigner verify "$apk"
          sha256sum "$apk"

      - name: Prepare direct APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk WeqexTube-1.0.12.apk

      - name: Publish verified direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.12 WeqexTube-1.0.12.apk --title "WeqexTube 1.0.12" --notes "Добавлен настоящий вход в YouTube через официальный Google OAuth-код устройства. Токен хранится зашифрованным и добавляется к запросам YouTube; резервный Piped-поток сохранён. Это экспериментальное исправление блокировки player response: результат зависит от аккаунта, IP/VPN и изменений YouTube."
