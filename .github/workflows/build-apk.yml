name: Build WeqexTube APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v6

      - name: Fetch latest LibreTube source
        run: |
          git clone --depth 1 https://github.com/libre-tube/LibreTube.git source
          git -C source log -1 --format='Upstream source: %H (%cs)'

      - name: Install build inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin apksigner

      - name: Apply complete WeqexTube 1.0.5 branding
        working-directory: source
        run: |
          sed -i 's/applicationId = "com.github.libretube"/applicationId = "app.weqextube"/' app/build.gradle.kts
          sed -i '/applicationIdSuffix = ".debug"/d' app/build.gradle.kts
          sed -i 's/resValue("string", "app_name", "LibreTube")/resValue("string", "app_name", "WeqexTube")/' app/build.gradle.kts
          sed -i 's/resValue("string", "app_name", "LibreTube Debug")/resValue("string", "app_name", "WeqexTube")/' app/build.gradle.kts
          sed -i 's/rootProject.name = "LibreTube"/rootProject.name = "WeqexTube"/' settings.gradle.kts
          sed -Ei 's/versionCode = [0-9]+/versionCode = 6/' app/build.gradle.kts
          sed -Ei 's/versionName = "[^"]+"/versionName = "1.0.5"/' app/build.gradle.kts

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Replace every user-visible localized occurrence, including spellings
          # such as "Libretube" that the previous case-sensitive replacement missed.
          for path in Path("app/src/main/res").glob("values*/strings.xml"):
              text = path.read_text()
              path.write_text(re.sub(r"libretube", "WeqexTube", text, flags=re.IGNORECASE))

          # Rebrand user-visible links, backup names and the update channel.
          replacements = {
              Path("app/src/main/java/com/github/libretube/ui/preferences/BackupRestoreSettings.kt"): {
                  "libretube-backup-": "weqextube-backup-",
              },
              Path("app/src/main/java/com/github/libretube/api/ExternalApi.kt"): {
                  "https://api.github.com/repos/libre-tube/LibreTube/releases/latest":
                      "https://api.github.com/repos/svmapo-afk/WeqexTube/releases/latest",
              },
              Path("app/src/main/java/com/github/libretube/ui/activities/AboutActivity.kt"): {
                  "https://github.com/libre-tube/LibreTube#donate":
                      "https://github.com/svmapo-afk/WeqexTube",
                  "https://libretube.dev":
                      "https://github.com/svmapo-afk/WeqexTube",
                  "https://github.com/libre-tube/LibreTube":
                      "https://github.com/svmapo-afk/WeqexTube",
                  "https://hosted.weblate.org/projects/libretube/libretube/":
                      "https://github.com/svmapo-afk/WeqexTube",
              },
              Path("app/src/main/java/com/github/libretube/ui/activities/HelpActivity.kt"): {
                  "https://libretube.dev/#faq":
                      "https://github.com/svmapo-afk/WeqexTube",
                  "https://matrix.to/#/#LibreTube:matrix.org":
                      "https://github.com/svmapo-afk/WeqexTube/issues",
                  "https://fosstodon.org/@libretube":
                      "https://github.com/svmapo-afk/WeqexTube/issues",
                  "https://feddit.rocks/c/libretube":
                      "https://github.com/svmapo-afk/WeqexTube/issues",
              },
          }
          for path, items in replacements.items():
              text = path.read_text()
              for old, new in items.items():
                  text = text.replace(old, new)
              path.write_text(text)

          # Remove all selectable alternative launcher aliases so Android cannot
          # retain an old LibreTube icon selected in an earlier installation.
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = re.sub(
              r'\s*<activity-alias\b(?=[^>]*android:name="\.(?:IconGradient|DefaultLight|IconFire|IconFlame|IconShaped|IconTorch|IconLegacy|IconBird)")[\s\S]*?</activity-alias>',
              '',
              text,
          )
          manifest.write_text(text)
          PY

          # Debug resources override main. Removing them is required for the
          # packaged APK to use WeqexTube's launcher artwork and app label.
          rm -rf app/src/debug/res

          sed -i 's|@drawable/splash_icon|@mipmap/ic_launcher_foreground|g' app/src/main/res/values/themes.xml app/src/main/res/values-night/themes.xml app/src/main/res/drawable/splash_anim.xml
          sed -i 's|@drawable/ic_launcher_lockscreen|@mipmap/ic_launcher|g' app/src/main/res/layout/app_icon_header.xml

          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            directory="app/src/main/res/mipmap-$1"
            rsvg-convert --width "$2" --height "$2" "$GITHUB_WORKSPACE/assets/weqextube-icon.svg" > "$directory/ic_launcher.png"
            cp "$directory/ic_launcher.png" "$directory/ic_launcher_round.png"
            cp "$directory/ic_launcher.png" "$directory/ic_launcher_foreground.png"
          done

          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#1D2C3E" android:pathData="M23,48 L31,48 L31,60 L23,60 Z M36,40 L44,40 L44,68 L36,68 Z M49,31 L57,31 L57,77 L49,77 Z M62,39 L86,54 L62,69 Z"/></vector>' > app/src/main/res/drawable/ic_launcher_monochrome.xml

      - name: Verify all visible source branding
        working-directory: source
        run: |
          grep -q 'applicationId = "app.weqextube"' app/build.gradle.kts
          grep -q 'versionCode = 6' app/build.gradle.kts
          grep -q 'versionName = "1.0.5"' app/build.gradle.kts
          grep -q '<string name="app_name" translatable="false">WeqexTube</string>' app/src/main/res/values/strings.xml
          grep -q '<string name="about">О WeqexTube</string>' app/src/main/res/values-ru/strings.xml
          grep -q 'Добро пожаловать в WeqexTube' app/src/main/res/values-ru/strings.xml
          grep -q 'svmapo-afk/WeqexTube/releases/latest' app/src/main/java/com/github/libretube/api/ExternalApi.kt
          grep -q 'weqextube-backup-' app/src/main/java/com/github/libretube/ui/preferences/BackupRestoreSettings.kt
          test ! -d app/src/debug/res
          test "$(grep -c '<activity-alias' app/src/main/AndroidManifest.xml)" -eq 1
          if grep -R -i "libretube" app/src/main/res/values*/strings.xml; then
            exit 1
          fi
          expected="$(sha256sum app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | cut -d' ' -f1)"
          printf '%s' "$expected" > "$GITHUB_WORKSPACE/expected-icon.sha256"

      - name: Build installable APK
        working-directory: source
        run: ./gradlew --no-daemon --refresh-dependencies :app:assembleDebug

      - name: Inspect packaged name, version, strings and icon
        run: |
          apk="source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"

          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -q "package: name='app.weqextube' versionCode='6' versionName='1.0.5'" /tmp/badging.txt
          grep -q "application-label:'WeqexTube'" /tmp/badging.txt

          "$aapt" dump resources "$apk" > /tmp/resources.txt
          if grep -Eqi 'LibreTube|Libretube' /tmp/resources.txt; then
            grep -Ei 'LibreTube|Libretube' /tmp/resources.txt
            exit 1
          fi

          unzip -p "$apk" res/mipmap-xxxhdpi-v4/ic_launcher.png > /tmp/apk-launcher.png
          actual="$(sha256sum /tmp/apk-launcher.png | cut -d' ' -f1)"
          expected="$(cat expected-icon.sha256)"
          test "$actual" = "$expected"

          apksigner verify "$apk"
          sha256sum "$apk"

      - name: Prepare direct APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk WeqexTube-1.0.5.apk

      - name: Publish verified direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.5 WeqexTube-1.0.5.apk --title "WeqexTube 1.0.5" --notes "Полный пользовательский ребрендинг: название WeqexTube во всех переводах, экран О приложении, приветствие, музыкальный режим, резервные копии, ссылки и канал обновлений. Имя, версия, строки и иконка проверены внутри готового APK."
